name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    env:
      REWARDS_START_DATE: ${{ vars.REWARDS_START_DATE }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript and Astro
        run: npm run check

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Build project
        run: npm run build
